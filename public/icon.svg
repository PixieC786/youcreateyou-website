<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%"   stop-color="#6030b0"/>
      <stop offset="100%" stop-color="#32186a"/>
    </radialGradient>

    <radialGradient id="bloom1" cx="50%" cy="55%" r="55%">
      <stop offset="0%"   stop-color="rgba(150,80,240,0.55)"/>
      <stop offset="100%" stop-color="rgba(150,80,240,0)"/>
    </radialGradient>

    <radialGradient id="bloom2" cx="50%" cy="42%" r="38%">
      <stop offset="0%"   stop-color="rgba(200,140,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(200,140,255,0)"/>
    </radialGradient>

    <filter id="text-glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Purple bloom layers (matching website hero) -->
  <ellipse cx="256" cy="280" rx="260" ry="220" fill="url(#bloom1)"/>
  <ellipse cx="256" cy="220" rx="180" ry="150" fill="url(#bloom2)"/>

  <!-- YOU wordmark — white, italic serif, matching nav style -->
  <text
    x="256"
    y="300"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="118"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
    fill="#f8f5ff"
    filter="url(#text-glow)">YOU</text>

</svg>
